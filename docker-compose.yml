services:

  mongodb:
    image: mongo:4
    ports:
     - "27017:27017"
    volumes:
     - mongodb_data:/data/db	
  redis:
    image: redis:latest
    ports:
     - "6379:6379"
  minio:
    image: minio/minio
    ports:
     - "9000:9000"
     - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
     - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 123456789
  qdrant:
    image: qdrant/qdrant
    ports:
     - "6333:6333"
    volumes:
     - qdrant_data:/data/storage
volumes:
  mongodb_data:
  minio_data:
  qdrant_data:
